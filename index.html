<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>🎁 You've Been Selected!</title>
<!-- Innocent-looking link preview so the bait works in the group chat -->
<meta name="description" content="Congratulations! You've been randomly selected to claim an exclusive reward. Limited time only.">
<meta property="og:title" content="🎁 You've Been Selected!">
<meta property="og:description" content="Congratulations! Claim your exclusive reward before it expires.">
<meta property="og:type" content="website">
<meta name="theme-color" content="#0b0221">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet">
<style>
  :root {
    --pink: #ff2fd6;
    --cyan: #19f6ff;
    --yellow: #ffe600;
    --purple: #7b2cff;
    --night: #0b0221;
    --green: #39ff14;
    color-scheme: dark;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; overflow: hidden; }
  body {
    background: var(--night);
    color: #fff;
    font-family: 'VT323', monospace;
    -webkit-tap-highlight-color: transparent;
    user-select: none;
  }

  /* ---------- background: user photo (bg.jpg) over a synthwave fallback ---------- */
  .bg {
    position: fixed; inset: 0; z-index: 0;
    background:
      linear-gradient(180deg, rgba(11,2,33,.35) 0%, rgba(11,2,33,.15) 45%, rgba(11,2,33,.75) 100%),
      url('bg.jpg') center / cover no-repeat,
      linear-gradient(180deg, #0b0221 0%, #2b0a4d 40%, #ff2fd6 62%, #0b0221 62.2%);
    filter: saturate(1.3) contrast(1.1);
  }
  .sun {
    position: fixed; left: 50%; top: 22%; width: min(60vw, 420px); aspect-ratio: 1;
    transform: translateX(-50%); border-radius: 50%; z-index: 0;
    background: linear-gradient(180deg, var(--yellow) 0%, #ff8a00 45%, var(--pink) 100%);
    -webkit-mask: repeating-linear-gradient(180deg, #000 0 14px, transparent 14px 20px);
            mask: repeating-linear-gradient(180deg, #000 0 14px, transparent 14px 20px);
    box-shadow: 0 0 80px var(--pink);
    opacity: .85;
  }
  .grid {
    position: fixed; left: -50%; right: -50%; bottom: 0; height: 40vh; z-index: 0;
    background:
      linear-gradient(var(--pink) 2px, transparent 2px) 0 0 / 60px 60px,
      linear-gradient(90deg, var(--pink) 2px, transparent 2px) 0 0 / 60px 60px;
    transform: perspective(300px) rotateX(60deg);
    transform-origin: bottom;
    animation: gridmove 1s linear infinite;
    opacity: .55;
  }
  body.has-photo .sun, body.has-photo .grid { display: none; }
  @keyframes gridmove { to { background-position: 0 60px, 0 60px; } }

  /* ---------- CRT overlay ---------- */
  .crt {
    pointer-events: none; position: fixed; inset: 0; z-index: 50;
    background: repeating-linear-gradient(0deg, rgba(0,0,0,.28) 0 2px, transparent 2px 4px);
    animation: flicker .12s infinite;
  }
  .crt::after {
    content: ""; position: absolute; inset: 0;
    background: radial-gradient(ellipse at center, transparent 55%, rgba(0,0,0,.75) 100%);
  }
  @keyframes flicker { 50% { opacity: .92; } }

  #confetti { position: fixed; inset: 0; z-index: 40; pointer-events: none; width: 100%; height: 100%; }

  .screen {
    position: fixed; inset: 0; z-index: 10;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 22px; text-align: center;
    padding: max(16px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) max(16px, env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px));
  }
  .hidden { display: none !important; }

  .pixel { font-family: 'Press Start 2P', monospace; }

  /* ---------- stage 1: the bait ---------- */
  .card {
    width: min(100%, 520px);
    background: rgba(11,2,33,.85);
    border: 4px solid var(--cyan);
    box-shadow: 0 0 0 4px var(--night), 0 0 0 8px var(--pink), 0 0 40px var(--pink);
    padding: 28px 20px;
  }
  .card h1 { font-size: clamp(14px, 4vw, 20px); color: var(--yellow); line-height: 1.6; text-shadow: 3px 3px 0 var(--pink); }
  .card p { font-size: 24px; color: var(--cyan); margin-top: 14px; }
  .gift { font-size: 64px; display: inline-block; animation: bob 1s ease-in-out infinite; margin-bottom: 8px; }
  @keyframes bob { 50% { transform: translateY(-10px) rotate(-6deg); } }

  .btn {
    font-family: 'Press Start 2P', monospace; font-size: 14px;
    padding: 16px 22px; margin-top: 22px; cursor: pointer;
    color: var(--night); background: var(--yellow);
    border: none; box-shadow: 4px 4px 0 var(--pink), 8px 8px 0 var(--cyan);
    transition: transform .08s;
  }
  .btn:active { transform: translate(4px, 4px); box-shadow: 0 0 0 var(--pink), 4px 4px 0 var(--cyan); }
  .blink { animation: blink 1s steps(1) infinite; }
  @keyframes blink { 50% { opacity: 0; } }

  /* ---------- stage 2: fake loading ---------- */
  .loader { width: min(100%, 520px); }
  .loader .status { font-size: 26px; color: var(--green); min-height: 2.6em; text-shadow: 0 0 8px var(--green); }
  .bar { height: 28px; border: 4px solid var(--green); padding: 3px; margin-top: 14px; }
  .bar > div { height: 100%; width: 0; background: repeating-linear-gradient(90deg, var(--green) 0 14px, transparent 14px 18px); transition: width .25s steps(6); }
  .pct { font-size: 12px; margin-top: 12px; color: var(--green); }

  /* ---------- stage 3: the reveal ---------- */
  .reveal { gap: 18px; }
  .kicker { font-size: clamp(10px, 2.6vw, 14px); color: var(--cyan); letter-spacing: 2px; text-shadow: 0 0 10px var(--cyan); }
  .big {
    font-family: 'Press Start 2P', monospace;
    font-size: clamp(34px, 11vw, 120px);
    line-height: 1.15;
    color: var(--yellow);
    text-shadow:
      4px 4px 0 var(--pink), 8px 8px 0 var(--purple), 12px 12px 0 var(--night),
      0 0 40px var(--pink);
    position: relative;
    animation: slam .6s cubic-bezier(.2,1.6,.4,1) both, wobble 2.4s ease-in-out .6s infinite;
  }
  .big span { display: block; }
  .big::before, .big::after {
    content: attr(data-text); position: absolute; inset: 0; white-space: pre-line;
    pointer-events: none; mix-blend-mode: screen;
  }
  .big::before { color: var(--cyan); animation: glitch1 2.2s infinite steps(1); }
  .big::after  { color: var(--pink); animation: glitch2 1.9s infinite steps(1); }
  @keyframes slam { 0% { transform: scale(6) rotate(-20deg); opacity: 0; } 100% { transform: scale(1) rotate(0); opacity: 1; } }
  @keyframes wobble { 0%,100% { transform: rotate(-2deg) scale(1); } 50% { transform: rotate(2deg) scale(1.04); } }
  @keyframes glitch1 { 0%,100%{clip-path: inset(0 0 100% 0);} 10%{clip-path: inset(10% 0 60% 0); transform: translate(-6px,0);} 12%{clip-path: inset(0 0 100% 0);} 55%{clip-path: inset(60% 0 15% 0); transform: translate(5px,0);} 58%{clip-path: inset(0 0 100% 0);} }
  @keyframes glitch2 { 0%,100%{clip-path: inset(0 0 100% 0);} 20%{clip-path: inset(40% 0 30% 0); transform: translate(6px,0);} 23%{clip-path: inset(0 0 100% 0);} 75%{clip-path: inset(80% 0 2% 0); transform: translate(-5px,0);} 78%{clip-path: inset(0 0 100% 0);} }

  .shake { animation: shake .5s; }
  @keyframes shake {
    10%,90% { transform: translate(-4px, 2px); } 20%,80% { transform: translate(6px,-4px); }
    30%,50%,70% { transform: translate(-10px, 6px); } 40%,60% { transform: translate(10px,-6px); }
  }

  .ticker {
    font-size: clamp(20px, 5vw, 30px); color: #fff; min-height: 1.4em;
    background: rgba(11,2,33,.8); border: 3px dashed var(--pink); padding: 6px 14px;
    max-width: 100%;
  }
  .scores {
    font-family: 'Press Start 2P', monospace; font-size: clamp(8px, 2.4vw, 11px);
    background: rgba(11,2,33,.85); border: 4px solid var(--cyan); padding: 14px 16px;
    line-height: 2.1; text-align: left; width: min(100%, 440px);
  }
  .scores h2 { font-size: inherit; color: var(--yellow); text-align: center; margin-bottom: 6px; }
  .scores .row { display: flex; justify-content: space-between; gap: 10px; }
  .scores .row.you { color: var(--pink); }
  .scores .row.you span:last-child { animation: blink .6s steps(1) infinite; }

  .actions { display: flex; gap: 18px; flex-wrap: wrap; justify-content: center; position: relative; }
  .btn.alt { background: var(--cyan); }
  #runaway { position: relative; transition: transform .15s ease-out; }

  .toast {
    position: fixed; left: 50%; bottom: calc(20px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%);
    z-index: 60; font-family: 'Press Start 2P', monospace; font-size: 10px; line-height: 1.6;
    background: var(--yellow); color: var(--night); padding: 12px 14px;
    box-shadow: 4px 4px 0 var(--pink); max-width: calc(100% - 32px); text-align: center;
    opacity: 0; transition: opacity .2s;
  }
  .toast.show { opacity: 1; }

  .coin { position: fixed; bottom: calc(14px + env(safe-area-inset-bottom, 0px)); right: calc(16px + env(safe-area-inset-right, 0px)); z-index: 20; font-size: 10px; color: var(--yellow); }

  @media (prefers-reduced-motion: reduce) {
    .grid, .big, .big::before, .big::after, .crt, .gift { animation: none !important; }
  }
</style>
</head>
<body>
  <div class="bg"></div>
  <div class="sun"></div>
  <div class="grid"></div>

  <!-- STAGE 1: bait -->
  <section class="screen" id="stage1">
    <div class="card">
      <div class="gift">🎁</div>
      <h1 class="pixel">CONGRATULATIONS!<br>YOU'VE BEEN SELECTED</h1>
      <p>You are visitor #1,000,000.<br>An exclusive reward is waiting for you.</p>
      <button class="btn blink" id="claim">▶ CLAIM REWARD</button>
    </div>
  </section>

  <!-- STAGE 2: fake loading -->
  <section class="screen hidden" id="stage2">
    <div class="loader">
      <div class="status" id="status">INITIALIZING...</div>
      <div class="bar"><div id="fill"></div></div>
      <div class="pct pixel" id="pct">0%</div>
    </div>
  </section>

  <!-- STAGE 3: reveal -->
  <section class="screen reveal hidden" id="stage3">
    <div class="kicker pixel">★ PLAYER 1 ★ GAME OVER ★</div>
    <div class="big" data-text="YOU ARE&#10;FUCKED"><span>YOU ARE</span><span>FUCKED</span></div>
    <div class="ticker" id="ticker">&nbsp;</div>
    <div class="scores">
      <h2>HIGH SCORES</h2>
      <div class="row"><span>1. THE BOYS</span><span>999999</span></div>
      <div class="row"><span>2. YOUR MOM</span><span>420069</span></div>
      <div class="row"><span>3. A PIGEON</span><span>001337</span></div>
      <div class="row you"><span>4. YOU</span><span>000000</span></div>
    </div>
    <div class="actions">
      <button class="btn" id="again">↻ TRY AGAIN</button>
      <button class="btn alt" id="runaway">✕ ESCAPE</button>
    </div>
  </section>

  <div class="coin pixel blink hidden" id="coin">INSERT COIN</div>
  <div class="toast" id="toast"></div>
  <canvas id="confetti"></canvas>
  <div class="crt"></div>

<script>
(() => {
  const $ = (id) => document.getElementById(id);

  // Use bg.jpg if it exists; otherwise keep the synthwave sun + grid.
  const probe = new Image();
  probe.onload = () => document.body.classList.add('has-photo');
  probe.src = 'bg.jpg';

  // ---------- tiny chiptune engine (WebAudio, no files) ----------
  let ac;
  const audio = () => (ac ||= new (window.AudioContext || window.webkitAudioContext)());
  function beep(freq, start, dur, type = 'square', vol = 0.08) {
    const ctx = audio(), o = ctx.createOscillator(), g = ctx.createGain();
    o.type = type; o.frequency.value = freq;
    g.gain.setValueAtTime(vol, ctx.currentTime + start);
    g.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + start + dur);
    o.connect(g).connect(ctx.destination);
    o.start(ctx.currentTime + start); o.stop(ctx.currentTime + start + dur + 0.02);
  }
  const blip = () => beep(880 + Math.random() * 400, 0, 0.05, 'square', 0.04);
  function sadTrombone() {
    [[392, 0], [370, .45], [349, .9]].forEach(([f, t]) => beep(f, t, .42, 'sawtooth', .07));
    const ctx = audio(), o = ctx.createOscillator(), g = ctx.createGain(), lfo = ctx.createOscillator(), lg = ctx.createGain();
    o.type = 'sawtooth'; o.frequency.value = 330;
    lfo.frequency.value = 6; lg.gain.value = 10; lfo.connect(lg).connect(o.frequency);
    g.gain.setValueAtTime(.07, ctx.currentTime + 1.35);
    g.gain.exponentialRampToValueAtTime(.0001, ctx.currentTime + 2.8);
    o.connect(g).connect(ctx.destination);
    o.start(ctx.currentTime + 1.35); lfo.start(ctx.currentTime + 1.35);
    o.stop(ctx.currentTime + 2.9); lfo.stop(ctx.currentTime + 2.9);
  }
  function victoryJingle() {
    [523, 659, 784, 1047, 784, 1047].forEach((f, i) => beep(f, i * 0.09, 0.12, 'square', 0.06));
  }

  // ---------- confetti (self-contained, no CDN) ----------
  const cv = $('confetti'), cx = cv.getContext('2d');
  let parts = [], running = false;
  const fit = () => { const d = devicePixelRatio || 1; cv.width = innerWidth * d; cv.height = innerHeight * d; cx.setTransform(d, 0, 0, d, 0, 0); };
  fit(); addEventListener('resize', fit);
  function fire({ particleCount = 50, angle = 90, spread = 45, startVelocity = 45, origin = {}, colors: cols = colors, shapes, scalar = 1 }) {
    const ox = (origin.x ?? 0.5) * innerWidth, oy = (origin.y ?? 0.5) * innerHeight;
    const emoji = shapes && typeof shapes[0] === 'object' ? shapes[0].text : null;
    for (let i = 0; i < particleCount; i++) {
      const a = (angle + (Math.random() - 0.5) * spread) * Math.PI / 180;
      const v = startVelocity * (0.5 + Math.random() * 0.5) * 0.35;
      parts.push({
        x: ox, y: oy, vx: Math.cos(a) * v, vy: -Math.sin(a) * v,
        s: (6 + Math.random() * 6) * scalar, rot: Math.random() * 6, vr: (Math.random() - 0.5) * 0.4,
        c: cols[(Math.random() * cols.length) | 0], emoji, life: 0, tilt: Math.random() * 6,
      });
    }
    if (!running) { running = true; requestAnimationFrame(step); }
  }
  function step() {
    cx.clearRect(0, 0, innerWidth, innerHeight);
    parts = parts.filter(p => p.y < innerHeight + 40 && p.life < 400);
    for (const p of parts) {
      p.life++; p.vy += 0.25; p.vx *= 0.985; p.vy *= 0.985;
      p.x += p.vx + Math.sin(p.tilt += 0.08) * 0.6; p.y += p.vy; p.rot += p.vr;
      cx.save(); cx.translate(p.x, p.y); cx.rotate(p.rot);
      if (p.emoji) { cx.font = `${p.s * 2}px serif`; cx.textAlign = 'center'; cx.fillText(p.emoji, 0, 0); }
      else { cx.fillStyle = p.c; cx.fillRect(-p.s / 2, -p.s / 2 * Math.abs(Math.cos(p.tilt)), p.s, p.s * Math.abs(Math.cos(p.tilt))); }
      cx.restore();
    }
    if (parts.length) requestAnimationFrame(step); else { running = false; cx.clearRect(0, 0, innerWidth, innerHeight); }
  }
  const confetti = { shapeFromText: ({ text }) => ({ text }) };
  const colors = ['#ff2fd6', '#19f6ff', '#ffe600', '#7b2cff', '#39ff14'];
  function boom() {
    fire({ particleCount: 180, spread: 100, startVelocity: 55, origin: { y: 0.6 }, colors, shapes: ['square'] });
    fire({ particleCount: 80, angle: 60, spread: 70, origin: { x: 0, y: 0.8 }, colors, shapes: ['square'] });
    fire({ particleCount: 80, angle: 120, spread: 70, origin: { x: 1, y: 0.8 }, colors, shapes: ['square'] });
  }
  function rain() {
    const end = Date.now() + 4000;
    (function frame() {
      fire({ particleCount: 4, angle: 60, spread: 55, origin: { x: 0 }, colors, shapes: ['square'] });
      fire({ particleCount: 4, angle: 120, spread: 55, origin: { x: 1 }, colors, shapes: ['square'] });
      if (Date.now() < end) requestAnimationFrame(frame);
    })();
  }
  let poopEmoji;
  try { poopEmoji = confetti.shapeFromText({ text: '💀', scalar: 3 }); } catch (e) {}

  // ---------- toast ----------
  let toastTimer;
  function toast(msg) {
    const t = $('toast'); t.textContent = msg; t.classList.add('show');
    clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove('show'), 2200);
  }

  // ---------- stage 2: the fake loading ----------
  const steps = [
    'CONNECTING TO REWARD SERVER...',
    'VERIFYING YOU ARE A LEGEND...',
    'ERROR: LEGEND NOT FOUND',
    'RETRYING WITH LOWER STANDARDS...',
    'SCANNING BROWSER HISTORY... 👀',
    'OH NO. OH NO NO NO.',
    'NOTIFYING THE GROUP CHAT...',
    'PACKAGING YOUR REWARD...',
  ];
  function loading(done) {
    let i = 0, pct = 0;
    const tick = () => {
      $('status').textContent = steps[i];
      pct = Math.min(99, Math.round(((i + 1) / steps.length) * 100) - (i === 2 ? 30 : 0));
      $('fill').style.width = pct + '%';
      $('pct').textContent = (i === 2 ? '❌ ' : '') + pct + '%';
      blip();
      i++;
      if (i < steps.length) setTimeout(tick, i === 3 ? 1100 : 650);
      else setTimeout(() => { $('fill').style.width = '100%'; $('pct').textContent = '100%'; setTimeout(done, 400); }, 600);
    };
    tick();
  }

  // ---------- stage 3: the reveal ----------
  const roasts = [
    'Skill issue detected.',
    'This incident has been reported to the group chat.',
    'Your reward: absolutely nothing. 🎉',
    'Imagine clicking a random link in 2026.',
    'Your FBI agent is laughing right now.',
    'Achievement unlocked: Professional Clown 🤡',
    'Lives remaining: 0',
    'Ratio + L + you clicked it.',
    'Screenshot taken. Just kidding. Or am I?',
    'The boys will never let you forget this.',
  ];
  let r = 0;
  function cycleRoasts() {
    const el = $('ticker');
    const type = (txt, k = 0) => {
      el.textContent = txt.slice(0, k) + (k < txt.length ? '█' : '');
      if (k < txt.length) setTimeout(() => type(txt, k + 1), 35);
    };
    type(roasts[r++ % roasts.length]);
  }

  function reveal() {
    $('stage2').classList.add('hidden');
    $('stage3').classList.remove('hidden');
    $('coin').classList.remove('hidden');
    document.title = '💀 YOU ARE FUCKED 💀';
    document.body.classList.add('shake');
    setTimeout(() => document.body.classList.remove('shake'), 500);
    sadTrombone();
    setTimeout(victoryJingle, 3000);
    boom(); rain();
    cycleRoasts(); setInterval(cycleRoasts, 3200);
    setInterval(boom, 6000);
    if (navigator.vibrate) navigator.vibrate([200, 100, 200, 100, 500]);
    // tab-title chaos
    const titles = ['💀 YOU ARE FUCKED 💀', '🤡 GOT YOU 🤡', '🎉 L + RATIO 🎉'];
    let ti = 0; setInterval(() => document.title = titles[ti++ % titles.length], 1200);
  }

  $('claim').addEventListener('click', () => {
    audio().resume?.();
    $('stage1').classList.add('hidden');
    $('stage2').classList.remove('hidden');
    loading(reveal);
  });

  // TRY AGAIN: replays the humiliation with skull confetti
  let tries = 0;
  const againMsgs = ['STILL FUCKED.', 'NOPE. STILL FUCKED.', 'TRYING HARDER WON\'T HELP.', 'BRO. STOP.', 'OK THIS IS SAD NOW.'];
  $('again').addEventListener('click', () => {
    toast(againMsgs[Math.min(tries++, againMsgs.length - 1)]);
    sadTrombone();
    document.body.classList.add('shake');
    setTimeout(() => document.body.classList.remove('shake'), 500);
    if (poopEmoji) fire({ particleCount: 40, spread: 120, origin: { y: 0.5 }, shapes: [poopEmoji], scalar: 3 });
    else boom();
  });

  // ESCAPE: runs away from you. There is no escape.
  const run = $('runaway');
  let dodges = 0;
  const escapeMsgs = ['NICE TRY.', 'THERE IS NO ESCAPE.', 'TOO SLOW.', 'LMAO', 'YOU CAN\'T LEAVE THE GAME.'];
  function dodge(e) {
    e && e.preventDefault();
    const maxX = Math.min(window.innerWidth / 2 - 80, 160), maxY = 120;
    const x = (Math.random() * 2 - 1) * maxX, y = (Math.random() * 2 - 1) * maxY;
    run.style.transform = `translate(${x}px, ${y}px) rotate(${(Math.random() * 40 - 20) | 0}deg)`;
    blip();
    if (++dodges % 3 === 0) toast(escapeMsgs[(dodges / 3 - 1) % escapeMsgs.length]);
  }
  run.addEventListener('mouseenter', dodge);
  run.addEventListener('touchstart', dodge, { passive: false });
  run.addEventListener('click', (e) => { dodge(e); toast('THERE IS NO ESCAPE.'); });

  // Trying to leave? Lol.
  try {
    history.pushState(null, '', location.href);
    addEventListener('popstate', () => { try { history.pushState(null, '', location.href); } catch (e) {} toast('BACK BUTTON? IN THIS ECONOMY?'); });
  } catch (e) {}
})();
</script>
</body>
</html>
